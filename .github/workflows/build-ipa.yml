name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "构建方式：unsigned 出未签名 ipa（全能签/AltStore 用）；其余三项用你自己的证书直接签好"
        required: true
        default: unsigned
        type: choice
        options:
          - unsigned
          - development
          - ad-hoc
          - app-store
      bundle_id:
        description: "Bundle ID（留空使用项目默认 com.scandoc.app）"
        required: false
        default: ""

jobs:
  build:
    name: 编译打包
    runs-on: macos-latest
    timeout-minutes: 40

    env:
      MODE: ${{ inputs.mode || 'unsigned' }}
      BUNDLE_ID_INPUT: ${{ inputs.bundle_id }}
      CERT_B64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      PROFILE_B64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'scandoc-ci' }}
      TEAM_ID_SECRET: ${{ secrets.TEAM_ID }}

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 查看 Xcode 版本
        run: xcodebuild -version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 确定 Bundle ID
        run: |
          if [ -n "$BUNDLE_ID_INPUT" ]; then
            BUNDLE_ID="$BUNDLE_ID_INPUT"
          else
            BUNDLE_ID="com.scandoc.app"
          fi
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"

      # ---------- 路线一：未签名 ipa（全能签 / AltStore / TrollStore） ----------

      - name: 编译并打包未签名 ipa
        if: env.MODE == 'unsigned'
        run: |
          set -euo pipefail

          xcodebuild archive \
            -project ScanDoc.xcodeproj \
            -scheme ScanDoc \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ScanDoc.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet

          APP_PATH="$RUNNER_TEMP/ScanDoc.xcarchive/Products/Applications/ScanDoc.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "找不到编译产物：$APP_PATH"
            find "$RUNNER_TEMP/ScanDoc.xcarchive" -maxdepth 4 -type d
            exit 1
          fi

          # 清掉可能残留的签名痕迹，交给全能签重新签
          rm -rf "$APP_PATH/_CodeSignature" "$APP_PATH/embedded.mobileprovision"

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"

          cd "$RUNNER_TEMP/ipa"
          zip -qry "ScanDoc-unsigned.ipa" Payload
          ls -lh "ScanDoc-unsigned.ipa"
          echo "IPA_PATH=$RUNNER_TEMP/ipa/ScanDoc-unsigned.ipa" >> "$GITHUB_ENV"

      - name: 上传未签名 ipa
        if: env.MODE == 'unsigned'
        uses: actions/upload-artifact@v4
        with:
          name: ScanDoc-unsigned-ipa
          path: ${{ runner.temp }}/ipa/ScanDoc-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      # ---------- 路线二：用你自己的证书签好 ----------

      - name: 检查签名材料
        if: env.MODE != 'unsigned'
        run: |
          if [ -z "$CERT_B64" ] || [ -z "$PROFILE_B64" ]; then
            echo "::error::缺少证书。要么把 mode 选成 unsigned，要么先配置 BUILD_CERTIFICATE_BASE64 与 PROVISIONING_PROFILE_BASE64。"
            exit 1
          fi

      - name: 导入证书与描述文件
        if: env.MODE != 'unsigned'
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/signing.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          echo -n "$CERT_B64" | base64 --decode > "$CERT_PATH"
          echo -n "$PROFILE_B64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$CERT_PATH" -k build.keychain -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain > /dev/null
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$RUNNER_TEMP/profile.plist")

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$(uuidgen).mobileprovision"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_TEAM=$PROFILE_TEAM" >> "$GITHUB_ENV"
          echo "已导入描述文件：$PROFILE_NAME（Team $PROFILE_TEAM）"

      - name: 归档并导出 ipa
        if: env.MODE != 'unsigned'
        run: |
          set -euo pipefail
          TEAM="${TEAM_ID_SECRET:-$PROFILE_TEAM}"
          if [ "$MODE" = "development" ]; then
            IDENTITY="Apple Development"
          else
            IDENTITY="Apple Distribution"
          fi

          xcodebuild archive \
            -project ScanDoc.xcodeproj \
            -scheme ScanDoc \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ScanDoc.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM" \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            -quiet

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${MODE}</string>
            <key>teamID</key>
            <string>${TEAM}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ScanDoc.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates

          ls -lh "$RUNNER_TEMP/export"

      - name: 上传已签名 ipa
        if: env.MODE != 'unsigned'
        uses: actions/upload-artifact@v4
        with:
          name: ScanDoc-${{ inputs.mode }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 30
